name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: page dataset (blocking)
        run: node validate.js index.html
      - name: profile linter (advisory until the waves land, then drop --advisory)
        run: node lint_profiles.js --advisory --page index.html "list/All-time" "list/Obtainable" "list/Herald"
