<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fate — L30 BiS Compendium</title>
<meta name="description" content="Sim-validated best-in-slot gear lists for 27 specs across all 13 classes at level 30 (patch 12.1.0, Midnight). All-Time, Full buffed, Obtainable, and Herald of the Titans variants with talents, consumables, and stat panels.">
<meta name="theme-color" content="#0b0d12">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Fate BiS Compendium">
<meta property="og:title" content="Fate — L30 BiS Compendium">
<meta property="og:description" content="Sim-validated BiS for 27 specs across all 13 classes at level 30. All-Time, Full buffed, Obtainable, and Herald of the Titans.">
<meta property="og:image" content="https://thefatesaber.github.io/BIS-List/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Fate — L30 BiS Compendium">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://thefatesaber.github.io/BIS-List/assets/og.png">
<!-- PNG first for Safari, which does not render SVG favicons; .ico for old IE/Edge. -->
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="shortcut icon" href="assets/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded without holding the page: a sheet for print does not block rendering,
     and becomes a sheet for the screen once it has arrived. Until then, and if
     the host never answers, the text shows in the fallback fonts. -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --void:#0b0d12; --slate:#141822; --slate2:#181d29; --edge:#232a39;
  /* --dim is the quietest text: level and source lines, labels, column heads,
     spec names in the class list. #7b8597 is 4.5 to 1 on the lightest row
     background and 5.2 on the page; it was #5c6575, 2.9 to 3.3 (ruling L1,
     2026-10-11: lift the grey, leave the sizes). */
  --parchment:#e7e4dc; --dust:#8e97a8; --dim:#7b8597;
  --epic:#a335ee;
  --confirmed:#41c176;
  --mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
  --display:"Cinzel", "Friz Quadrata", Georgia, serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--void); color:var(--parchment);
  font-family:var(--mono); font-size:13.5px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
/* Off screen until it takes keyboard focus: one Tab from the top, then Enter,
   lands past the class list. */
.skip{position:absolute; left:8px; top:-48px; z-index:10; padding:6px 12px; border-radius:4px;
  background:var(--parchment); color:var(--void); font-size:12px; font-weight:600; text-decoration:none}
.skip:focus{top:8px}
main:focus{outline:none}

/* ---------- masthead ---------- */
header{
  border-bottom:1px solid var(--edge);
  padding:20px 24px 16px;
  display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 18px;
}
header h1{
  margin:0; font-family:var(--display); font-weight:700;
  font-size:clamp(19px,3.2vw,26px); letter-spacing:.04em; color:var(--parchment);
}
header h1 .thirty{color:var(--epic)}
.meta{color:var(--dust); font-size:12px; letter-spacing:.02em}
.meta b{color:var(--parchment); font-weight:500}

/* ---------- layout ---------- */
.layout{display:flex; min-height:calc(100vh - 70px)}
.side{
  width:196px; flex:0 0 196px; border-right:1px solid var(--edge);
  display:flex; flex-direction:column; min-height:0;
}
nav{flex:1; padding:8px 0 12px; overflow-y:auto}
/* Capped: past this the gap between an item's name and its enchant only grows
   (890 px of it on a 2560 px screen). */
main{flex:1; min-width:0; max-width:1400px; padding:20px 24px 48px}

/* ---------- class rail ---------- */
.sortrow{display:flex; align-items:center; gap:10px; padding:12px 14px 10px;
  border-bottom:1px solid var(--edge)}
.sortlabel{color:var(--dust); font-size:11px; letter-spacing:.1em; text-transform:uppercase}
.classrow{display:none; align-items:center; gap:10px; padding:10px 14px;
  border-bottom:1px solid var(--edge)}
#sortsel, #classsel{
  flex:0 0 auto; width:auto; background:var(--slate2); border:1px solid var(--edge);
  color:var(--parchment); font:inherit; font-size:12px; letter-spacing:.05em;
  padding:6px 28px 6px 12px; border-radius:6px; cursor:pointer;
  appearance:none; -webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='5' viewBox='0 0 8 5'><path d='M0 0l4 5 4-5z' fill='%238a93a6'/></svg>");
  background-repeat:no-repeat; background-position:right 10px center;
}
#classsel{flex:1; min-width:0; width:100%}
#sortsel:hover, #classsel:hover{border-color:var(--dust)}
#sortsel:focus-visible, #classsel:focus-visible{outline:2px solid var(--epic); outline-offset:2px}

.cls{
  display:flex; align-items:center; gap:10px; width:100%;
  padding:8px 16px; background:none; border:0; border-left:3px solid transparent;
  color:var(--dust); font:inherit; font-size:13px; cursor:pointer; text-align:left;
}
.cls:hover{color:var(--parchment); background:var(--slate)}
.cls.on{color:var(--parchment); background:var(--slate); border-left-color:var(--cc)}
.cls .dot{width:9px; height:9px; border-radius:2px; background:var(--cc); flex:0 0 9px}
.cls .who{display:flex; flex-direction:column; min-width:0}
.cls .who small{color:var(--dim); font-size:10.5px; letter-spacing:.03em}
.cls .dps{flex:none; white-space:nowrap; margin-left:auto; padding-left:8px; color:var(--dim); font-size:11px;
  font-variant-numeric:tabular-nums; letter-spacing:.02em; transition:color .15s ease}
.cls:hover .dps{color:var(--dust)}
.cls.on .dps{color:var(--cc); font-weight:600}

/* ---------- spec header + tabs ---------- */
.spec-head{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 14px; margin:0 0 14px}
.spec-head h2{
  margin:0; font-family:var(--display); font-weight:600;
  font-size:clamp(17px,2.6vw,22px); letter-spacing:.03em; color:var(--cc,#fff);
}
/* Class colours are the game's own and are used as they are, on small text
   too (ruling L2, 2026-10-11). Three are dark for small text on this
   background: Death Knight 3.0 to 1, Demon Hunter 3.2, Shaman 3.7. A lighter
   cut for the numbers was built and not taken. */
.dpsbadge{display:inline-flex; align-items:baseline; gap:5px; margin-left:2px; padding:3px 10px;
  border:1px solid color-mix(in srgb, var(--cc) 45%, transparent); border-radius:999px;
  background:color-mix(in srgb, var(--cc) 12%, transparent);
  color:var(--cc); font-size:14px; font-weight:700; letter-spacing:0;
  font-variant-numeric:tabular-nums; text-transform:none}
.dpsbadge b{font-weight:700}
.efftag{font:inherit; font-size:10px; font-weight:600; letter-spacing:.07em; text-transform:uppercase;
  padding:2px 7px; border-radius:3px; white-space:nowrap; cursor:pointer;
  color:#e0a53f; background:none; border:1px solid currentColor}
.efftag .effraw{display:none; font-weight:500; letter-spacing:.02em; text-transform:none}
.efftag.open .effraw{display:inline}
.efftag:focus-visible{outline:2px solid var(--epic); outline-offset:2px}
.simdate{color:var(--dust); font-size:11.5px; white-space:nowrap}
.preview{font-size:10px; font-weight:600; letter-spacing:.07em; text-transform:uppercase;
  padding:2px 7px; border-radius:3px; white-space:nowrap; color:#e0a53f; border:1px solid currentColor}
.cls .dps .eff{font-size:8.5px; font-weight:600; letter-spacing:.05em;
  text-transform:uppercase; color:#e0a53f; font-style:normal}
.cls .who small .specvar{margin-left:3px; font-style:normal; opacity:.75}
.spec-head .clsname{color:var(--cc,var(--dust)); font-family:var(--display); font-weight:600;
  letter-spacing:.03em; font-size:clamp(17px,2.6vw,22px)}
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px}
.tab{
  font:inherit; font-size:12px; letter-spacing:.02em; cursor:pointer;
  color:var(--dust); background:var(--slate); border:1px solid var(--edge);
  border-radius:3px; padding:5px 12px;
}
.tab:hover{color:var(--parchment)}
.tab.on{color:var(--void); background:var(--parchment); border-color:var(--parchment); font-weight:600}
.constraint{color:var(--dim); font-size:11.5px; margin:0 0 16px; font-style:italic}
.meta .updated{color:var(--dim)}
.notice a{color:var(--dim); text-decoration:underline dotted}
.notice a:hover{color:var(--parchment)}
/* Two-way switch above the class list. The rail is 196 px wide, so the labels
   are set at 10.5px: "Best per class" and "All specs" need 172 px of the 176. */
.viewtoggle{display:flex; margin:12px 10px 0}
.viewtoggle button{flex:1 1 auto; min-width:0; overflow:hidden; padding:5px 6px; font:inherit; font-size:10.5px;
  white-space:nowrap; background:none; border:1px solid var(--edge); color:var(--dust); cursor:pointer;
  transition:background-color .15s ease, color .15s ease, border-color .15s ease}
.viewtoggle button:first-child{border-radius:6px 0 0 6px}
.viewtoggle button:last-child{border-radius:0 6px 6px 0; border-left:none}
.viewtoggle button:hover{color:var(--parchment)}
.viewtoggle button.on{color:var(--parchment); background:var(--edge)}
.viewtoggle button:focus-visible{outline:2px solid var(--epic); outline-offset:2px; position:relative}
.notice{color:var(--dim); font-size:12.5px; margin-top:4px; max-width:78ch}
.notice .nbtn{background:none; border:none; color:var(--dim); cursor:pointer; font:inherit;
  text-decoration:underline dotted; padding:0}
.notice .nbtn:hover{color:var(--parchment)}
.notice .chip{display:inline-block; font-size:10px; text-transform:uppercase; letter-spacing:.4px;
  border:1px solid var(--edge); border-radius:3px; padding:0 4px; margin-right:6px; color:var(--dim)}
.notice ul.nlist{list-style:none; margin:6px 0 0; padding:0; max-height:38vh; overflow-y:auto}
.notice ul.nlist li{margin:0 0 6px; padding-left:2px}

/* ---------- slot ledger ---------- */
.ledger{border:1px solid var(--edge); border-radius:4px; overflow:hidden}
.row{
  display:grid; grid-template-columns:104px minmax(0,1.9fr) minmax(0,.8fr) minmax(0,1fr);
  gap:0 14px; padding:7px 14px; align-items:center;
  border-bottom:1px solid var(--edge); background:var(--slate);
}
.row:nth-child(even){background:var(--slate2)}
.row:last-child{border-bottom:0}
.row.head{
  background:var(--void); color:var(--dim); font-size:10.5px;
  text-transform:uppercase; letter-spacing:.09em; padding:8px 14px;
}
.slot{color:var(--dust); font-size:12px}
.item a{color:var(--epic); text-decoration:none; font-weight:500; display:inline-flex; align-items:center; gap:10px}
/* Icons carry no quality ring (ruling L4, 2026-10-11). One was declared here
   from the start, as a box-shadow in the item's quality colour. The clip-path
   that rounds the icon clipped it, all but a stray one-pixel sliver along an
   edge wherever an icon landed on a fraction of a pixel. */
.item a span[class*="icon"]{flex:none; width:34px !important; height:34px !important;
  box-sizing:border-box !important; border:0 !important; padding:0 !important; margin:0 !important;
  border-radius:4px; overflow:hidden; clip-path:inset(0 round 4px);
  background-size:34px 34px !important; background-position:center !important}
.item a span[class*="icon"] ins{display:block; position:static !important; width:100% !important; height:100% !important;
  margin:0 !important; border:0 !important; background-size:cover !important; background-position:center !important}
.item a span[class*="icon"] del{display:none !important}
/* Quality colours. The classes are the page's own, quality-1 to quality-5,
   and must not be q1 to q5: Wowhead's style sheet colours anything with a
   class q0 to q6, with !important. Until 2026-10-11 the links carried q3, and
   on the live site every rare name was drawn in the blue below (5.1 to 5.4 to
   1 on these rows) and repainted a moment later in Wowhead's darker #0070dd
   (3.5 to 3.7). Ruling D9: the lighter blue. A link with no class is epic. */
.item a.quality-1{color:#eaeaea}.item a.quality-2{color:#1eff00}.item a.quality-3{color:#2f8dff}.item a.quality-5{color:#ff8000}
.gems a{--qc:var(--epic)}
.gems a.quality-1{--qc:#eaeaea}
.gems a.quality-2{--qc:#1eff00}
.gems a.quality-3{--qc:#2f8dff}
.gems a.quality-5{--qc:#ff8000}
.item a:hover{text-decoration:underline}
.item .none{color:var(--dim); margin-left:44px}
.ench,.gems{color:var(--dust); font-size:12px; overflow-wrap:anywhere}
.ench a{color:#2f8dff; text-decoration:none}
.ench a:hover{text-decoration:underline}
.ench a ins, .ench a del, .ench a span[class*="icon"]{display:none !important}
.gemgrp{display:flex; align-items:center; gap:6px; padding:2px 0; flex-wrap:wrap}
.gems a{color:var(--qc); text-decoration:none; display:inline-flex; align-items:center; gap:8px}
/* icon-only socket: keeps a visible socket square even if Wowhead never iconizes */
/* Extra socket icons must look identical to the named one, which has no ring.
   Background is a fallback so the socket is still countable if iconization
   ever fails. */
.gems a.gicon{width:24px; height:24px; border-radius:3px; flex:none;
  background:rgba(255,255,255,.045)}
.hm{margin-left:8px; font-size:10px; font-weight:600; letter-spacing:.06em;
  text-transform:uppercase; padding:1px 6px; border-radius:3px; white-space:nowrap;
  border:1px solid currentColor}
.hm.only{color:#ff9d5c}
.hm.socket{color:#ff5c5c}
.hm.craft{color:#6fc3d6}
.profs{color:var(--dust); font-size:11.5px; margin:-10px 0 16px}
.profs b{color:var(--parchment); font-weight:600}
.profs .sep{opacity:.5; margin:0 5px}
.vtag{margin-left:7px; font-size:9.5px; font-weight:600; letter-spacing:.07em;
  text-transform:uppercase; padding:1px 5px; border-radius:3px; white-space:nowrap;
  color:#e0a53f; border:1px solid currentColor; vertical-align:1px}
.alts{grid-column:2 / -1; padding-left:44px; padding-top:2px;
  color:var(--dim); font-size:11px; overflow-wrap:anywhere}
.alts em{font-style:normal; color:var(--dim); text-transform:uppercase;
  font-size:9.5px; letter-spacing:.07em; margin-right:5px}
.alts a{color:#9fb6d4; text-decoration:none}
/* An alternate with a quality on record takes that colour; one without keeps
   the muted blue above. Wowhead's sheet used to do this, once it had loaded. */
.alts a.quality-1{color:#eaeaea}.alts a.quality-2{color:#1eff00}.alts a.quality-3{color:#2f8dff}
.alts a.quality-4{color:var(--epic)}.alts a.quality-5{color:#ff8000}
.alts a:hover{text-decoration:underline}
.alts a ins, .alts a del, .alts a span[class*="icon"]{display:none !important}
.alts .delta{color:var(--dust)}
.alts .pending{color:var(--dim); font-style:italic}
.alts .sep{opacity:.5; margin:0 3px}
.alts.fb{opacity:.82}
.gems a span[class*="icon"], .consum a span[class*="icon"]{flex:none; width:24px !important; height:24px !important;
  box-sizing:border-box !important; border:0 !important; padding:0 !important; margin:0 !important;
  border-radius:3px; overflow:hidden; clip-path:inset(0 round 3px);
  background-size:24px 24px !important; background-position:center !important}
.gems a span[class*="icon"] ins, .consum a span[class*="icon"] ins{display:block; position:static !important; width:100% !important; height:100% !important;
  margin:0 !important; border:0 !important; background-size:cover !important; background-position:center !important}
.gems a span[class*="icon"] del, .consum a span[class*="icon"] del{display:none !important}
.gems a:hover{text-decoration:underline}
.note{
  grid-column:2 / -1; color:var(--dim); font-size:11.5px; padding-top:1px; padding-left:44px;
}

/* ---------- notes + actions ---------- */
.statpanel{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:0 18px;
  margin:0 0 14px; padding:14px 16px; border:1px solid var(--edge); border-radius:6px;
  background:linear-gradient(180deg, rgba(255,255,255,.035), transparent 65%), var(--slate)}
.statcell{display:flex; flex-direction:column; gap:3px; padding:7px 0}
.statcell.r{align-items:flex-end; text-align:right}
.statcell .lbl{color:var(--parchment); font-size:11px; letter-spacing:.09em; text-transform:uppercase; font-weight:600}
.statcell .val{display:flex; align-items:baseline; gap:8px; font-variant-numeric:tabular-nums}
.statcell.r .val{flex-direction:row-reverse}
.statcell .pct{color:var(--cc); font-size:15px; font-weight:700}
.statcell .rat{color:var(--dim); font-size:11.5px}
.statweb{grid-column:2; grid-row:1 / span 2; display:block; justify-self:center; max-width:100%}
.statpanel.wtop .statweb{grid-row:2 / span 2}
.stattop{grid-column:1 / -1; display:grid; grid-template-columns:1fr auto 1fr;
  grid-template-columns:subgrid}
.stattop > .statcell{grid-column:1}
.stattop > .statcell.r{grid-column:3}
.statweb .ring{fill:none; stroke:rgba(255,255,255,.14); stroke-width:1}
.statweb .ring:first-of-type{stroke:rgba(255,255,255,.24); stroke-width:1.5;
  fill:color-mix(in srgb, var(--cc) 7%, transparent)}
.statweb .axis{stroke:rgba(255,255,255,.10); stroke-width:1; stroke-dasharray:2 3}
.statweb .area{fill:color-mix(in srgb, var(--cc) 26%, transparent); stroke:var(--cc); stroke-width:1.5;
  stroke-linejoin:round}
.statweb .dot{fill:var(--parchment); stroke:var(--cc); stroke-width:1.5}
.paneline{display:grid; grid-template-columns:auto minmax(0,1fr); grid-template-rows:auto auto auto;
  gap:14px; margin:0 0 14px}
.paneline > .statpanel{grid-column:1; grid-row:1 / 3; margin:0}
.paneline > .consum{grid-column:2; grid-row:1; margin:0; min-width:0}
.paneline > .talents{grid-column:2; grid-row:2; margin:0; min-width:0}
.paneline > .buffworth{grid-column:2; grid-row:3; margin:0; min-width:0}
.paneline.wbw > .statpanel{grid-row:1 / 4; align-content:center}
.consum.buffworth{display:block}
.buffworth h3{margin:0 0 8px; font:600 13.5px var(--display); letter-spacing:.08em;
  color:var(--cc,var(--parchment)); display:flex; align-items:center; gap:10px; text-transform:none}
.buffworth h3::after{content:""; flex:1; height:1px;
  background:linear-gradient(90deg, var(--cc,var(--edge)), var(--edge) 38%)}
#buffworthlines{display:grid; grid-template-columns:max-content max-content max-content max-content minmax(0,1fr);
  gap:3px 12px; align-items:baseline}
.buffworth .cline{display:contents}
.buffworth .cline > *{white-space:nowrap}
.buffworth .cline > .bwnote{white-space:normal}
.buffworth .bwval{color:var(--dust); font-weight:600; text-align:right}
.buffworth .bwpct{text-align:right}
.buffworth .bwtag{border:1px solid rgba(255,255,255,.22); border-radius:8px; padding:0 6px;
  font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; cursor:help; justify-self:start}
.buffworth .cline.bwsub{display:none}
#buffworthlines.cmpopen .cline.bwsub{display:contents}
.buffworth .bwhead{cursor:pointer}
.buffworth .bwtoggle{font:inherit; letter-spacing:inherit; text-transform:inherit; color:inherit;
  background:none; border:0; padding:0; margin:0; cursor:pointer}
.buffworth .bwtoggle:focus-visible{outline:2px solid var(--epic); outline-offset:2px}
.buffworth .bwhead b::before{content:"\25B8 "; color:var(--dust)}
#buffworthlines.cmpopen .bwhead b::before{content:"\25BE "}
.buffworth .cline.bwsub b{font-weight:400; color:var(--dust); padding-left:14px; position:relative}
.buffworth .cline.bwsub b::before{content:"\2514"; position:absolute; left:2px; color:var(--dim)}
.buffworth .cline.bwsub .bwval{color:var(--dust); font-weight:400}
.paneline.solo{grid-template-columns:minmax(0,1fr)}
.paneline.solo > .consum, .paneline.solo > .talents{grid-column:1}
.statpanel[hidden], .consum[hidden]{display:none !important}
.consum{display:flex; align-items:center; align-content:center; flex-wrap:wrap; gap:6px 14px;
  margin:0 0 14px; padding:9px 12px;
  border:1px solid var(--edge); border-radius:4px; background:var(--slate)}
.consum h3{margin:0; flex:none; font:600 12.5px var(--display); letter-spacing:.08em;
  color:var(--dust)}
.consum .chead{flex:none; display:flex; flex-direction:column; gap:1px}
.consum .chead small{color:var(--dust); font-size:11px}
#consumlines{display:contents}
.consum .cline{color:var(--dust); font-size:12px}
.consum .cline b{color:var(--dim); font-weight:600; font-size:10px; letter-spacing:.07em;
  text-transform:uppercase; margin-right:5px}
.consum .cline small{color:var(--dim); font-size:10.5px; margin-left:3px}
/* A consumable line is one unit: label, icon, name, hand. It only breaks inside
   when it is alone on its row and still too wide (a 320 px phone). */
#consumlines .cline{display:inline-flex; align-items:center; min-width:0}
#consumlines .cline b, #consumlines .cline small{flex:none}
#consumlines .cline a{display:inline-flex; align-items:center; gap:7px; min-width:0}
#consumlines .cline small{margin-left:8px}
.consum .cbreak{flex:1 0 100%; height:0; margin:0; padding:0}
.consum .tbtn{margin-left:auto}
.talents{display:flex; align-items:center; gap:10px; margin:0 0 14px; padding:9px 12px;
  border:1px solid var(--edge); border-radius:4px; background:var(--slate)}
.talents h3{margin:0; flex:none; font:600 12.5px var(--display); letter-spacing:.08em;
  color:var(--dust)}
/* The string is longer than its box on most screens and scrolls sideways. The
   fade at the right edge says so; the padding lets the last characters scroll

  -webkit-mask-image:linear-gradient(90deg, #000 calc(100% - 28px), transparent);
  mask-image:linear-gradient(90deg, #000 calc(100% - 28px), transparent)}

.tbtn:active{transform:translateY(0) scale(.98)}

.credit{margin:10px 2px 0; color:var(--dim); font-size:11.5px; font-style:italic}
.why{grid-column:2 / -1; margin:5px 0 2px 44px; padding:7px 10px; border-left:2px solid var(--edge);

.why b{color:var(--parchment); font-weight:600; letter-spacing:.02em}

.why a ins, .why a del, .why a span[class*="icon"]{display:none !important}
.actions{margin-top:16px; display:flex; gap:10px; align-items:center}
.btn{

/* ---------- key ---------- */
/* Under the list: one line per kind of badge the list carries. Under Buff
   worth: what its tags mean. Both say what the hover tooltips say, for a
   screen with no hover. */
.key{margin:10px 2px 0; padding:0; list-style:none; display:flex; flex-wrap:wrap; gap:5px 18px;
  color:var(--dim); font-size:11.5px}
.key[hidden]{display:none}
.key li{display:flex; align-items:baseline; gap:7px; min-width:0}
.key .hm, .key .vtag{margin-left:0; flex:none}
.bwkey{margin:8px 0 0; color:var(--dim); font-size:11px; line-height:1.5}
.bwkey b{color:var(--dust); font-weight:600; font-size:9.5px; letter-spacing:.06em;
  text-transform:uppercase}

/* ---------- motion ---------- */
.row{transition:background-color .16s ease}
.row:hover{background:rgba(255,255,255,.03)}
.row.head{transition:none}
.item a, .gems a, .ench a{transition:color .15s ease, filter .15s ease}
.item a:hover, .gems a:hover{filter:brightness(1.16)}
.item a span[class*="icon"], .gems a span[class*="icon"]{
  transition:transform .18s cubic-bezier(.2,.8,.36,1.15);
}
.item a:hover span[class*="icon"]{transform:translateY(-1px) scale(1.045)}
.gems a:hover span[class*="icon"]{transform:scale(1.07)}
.item a span[class*="icon"] ins{transition:transform .3s ease}
.item a:hover span[class*="icon"] ins{transform:scale(1.1)}
.cls, .tab, .btn, #sortsel{transition:background-color .15s ease, color .15s ease,
  border-color .15s ease, transform .13s ease, box-shadow .18s ease}
.tab:hover{transform:translateY(-1px)}
.tab:active{transform:translateY(0) scale(.98)}
.cls:hover{transform:translateX(2px)}
.cls:active{transform:translateX(2px) scale(.985)}
.btn:hover{transform:translateY(-1px); box-shadow:0 3px 10px -4px rgba(0,0,0,.7)}
.btn:active{transform:translateY(0) scale(.98)}
@media (prefers-reduced-motion: no-preference){
  .row{animation:rowIn .26s cubic-bezier(.22,.7,.3,1) both;
    animation-delay:calc(min(var(--i,0), 18) * 13ms)}
  .row.head{animation:none}
  @keyframes rowIn{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}
}
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{animation:none !important; transition:none !important}
}

/* ---------- responsive ---------- */
/* Two columns need about 900 px beside the class list: the stat panel takes
   438, a consumable line up to 320 and a Buff worth row with its note about
   460. Below that the four panels stack. From 861 to about 1000 px the two
   columns used to push every view past the right edge, and to 1100 on the
   Full buffed tab. */
@media (max-width:1180px){
  .paneline, .paneline.wbw{grid-template-columns:minmax(0,1fr)}
  .paneline > .statpanel, .paneline.wbw > .statpanel,
  .paneline > .consum, .paneline > .talents, .paneline > .buffworth{grid-column:1; grid-row:auto}
}
/* Stacked and wider than a phone, the stat panel keeps its labels beside the
   chart instead of at the two ends of a 900 px card. */
@media (min-width:521px) and (max-width:1180px){
  .statpanel{grid-template-columns:minmax(0,200px) auto minmax(0,200px); justify-content:center}
}
/* On a phone a Buff worth row is name, DPS, percent and tag, set a little
   tighter so the longest name (Bloodlust (Drums)) fits a 360 px screen; its
   note takes a line of its own. Consumables go one to a row, icons in line. */
@media (max-width:520px){
  #buffworthlines{grid-template-columns:minmax(0,1fr) max-content max-content max-content; gap:3px 6px}
  .buffworth .cline > b{white-space:normal; letter-spacing:.02em; margin-right:0}
  .buffworth .cline > small{margin-left:0}
  .buffworth .bwtag{padding:0 5px; letter-spacing:.03em}
  .buffworth .cline > .bwnote{grid-column:1 / -1; margin:-3px 0 3px}
  .buffworth .cline.bwsub > .bwnote{padding-left:14px}
  .buffworth .cline > .bwnote:empty{display:none}
  #consumlines .cline{flex:1 0 100%}
  #consumlines .cline b{min-width:50px}
  #consumlines .cline.cont{padding-left:55px}
}
/* Below 350 px the tag goes: a name would otherwise run into its number. */
@media (max-width:350px){
  #buffworthlines{grid-template-columns:minmax(0,1fr) max-content max-content}
  .buffworth .bwtag{display:none}
}
@media (max-width:860px){
  .layout{display:block}
  .side{width:auto; flex:none; display:block; border-right:0}
  .viewtoggle{margin:12px 12px 2px}
  .viewtoggle button{font-size:12px; padding:7px 8px}
  .sortrow{padding:10px 12px}
  .classrow{display:flex; padding:10px 12px}
  nav{display:none}
  main{padding:16px 14px 40px}
  .statpanel{gap:0 10px; padding:12px}
  .statweb{width:104px; height:104px}
  .consum{gap:5px 10px}
  .consum .tbtn{margin-left:0; flex:1 0 100%; order:9}
  .statcell .pct{font-size:14px}
  .talents{flex-wrap:wrap; gap:6px}
  .talents code{flex:1 0 100%; order:3}
}
/* Gear rows stack below 701 px, and a row then reads top to bottom: slot,
   item, its level and source, its enchant, its gems by name, the note, the
   alternates. Nothing the table shows is left out (ruling M1 and M2,
   2026-10-11: a phone used to get no enchant at all and gems as icons with
   no name). The enchant has no column head here, so it carries its own
   label. From 701 px up the four-column table fits, so an upright tablet
   (744 or 768 px) and a narrow desktop window get the table. */
@media (max-width:700px){
  .row{grid-template-columns:minmax(0,1fr); gap:2px 0; padding:9px 12px}
  .row.head{display:none}
  .slot{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--dim)}
  .note{order:1}
  .ench{order:2; padding-left:44px}
  .ench:empty, .gems:empty{display:none}
  .ench:not(:empty)::before{content:"Enchant"; margin-right:8px; color:var(--dim); font-weight:600;
    font-size:10px; letter-spacing:.07em; text-transform:uppercase}
  .gems{order:3; padding-left:44px}
  /* A gem's icons and its name stay on one line; on a 320 px screen a long
     name wraps beside the icons instead of dropping under them. */
  .gemgrp{padding:1px 0; flex-wrap:nowrap}
  .why{order:4; margin-left:0; max-width:none}
  .alts{order:5; padding-left:44px}
  .note, .why, .alts{grid-column:1}
}
.tab:focus-visible,.cls:focus-visible,.btn:focus-visible,.item a:focus-visible{
  outline:2px solid var(--epic); outline-offset:2px;
}

// Parsed as UTC so the rendered date doesn't shift a day west of Greenwich.
function fmtUpdated(iso){
  const [y, m, d] = String(iso).split("-").map(Number);
  if(!y || !m || !d) return iso;
  return new Date(Date.UTC(y, m-1, d)).toLocaleDateString("en-GB",
    { day:"numeric", month:"short", year:"numeric", timeZone:"UTC" });
}
// Sim date beside the number (ruling D5, 2026-10-11). prov reads
// "simmed YYYY-MM-DD \u00b7 Raidbots Advanced" and was only the badge's hover
// tooltip, which a phone never shows. A prov with no date prints nothing here.
function simDateHtml(cls){
  const m = /^simmed (\d{4}-\d{2}-\d{2}) \u00b7 (.+)$/.exec((cls.prov && cls.prov[state.list]) || "");
  if(!m) return "";
  return '<span class="simdate">simmed '+esc(fmtUpdated(m[1]))+' \u00b7 '+esc(m[2].replace(/^Raidbots Advanced$/, "Raidbots"))+'</span>';
}
function whRefresh(){
  if (window.$WowheadPower && window.$WowheadPower.refreshLinks) window.$WowheadPower.refreshLinks();
}
function renderMain(){
  const cls = CLASSES.find(c => c.id === state.cls);
  const lt  = LIST_TYPES.find(l => l.id === state.list);
  const eff = effOf(cls);

  $("spechead").innerHTML =
    '<h2 style="--cc:'+cls.color+'">'+esc(specOf(cls, state.list))+'</h2>'
    + '<span class="clsname" style="--cc:'+cls.color+'">'+esc(cls.name)+'</span>'
    + (dpsFor(cls) ? '<span class="dpsbadge" style="--cc:'+cls.color+'"'+(cls.prov && cls.prov[state.list] ? ' title="'+esc(cls.prov[state.list])+'"' : '')+'><b>'+dpsFor(cls).toLocaleString()+'</b> DPS</span>' : "")
    + (eff ? '<button type="button" class="efftag" aria-expanded="false" title="'+esc(eff.tip)+'">effective<span class="effraw"> \u00b7 '+esc(eff.raw)+'</span></button>' : "")
    + (dpsFor(cls) ? simDateHtml(cls) : "")
    // Ruling D6, 2026-10-11: an entry kept out of the class list (hidden:true)
    // still opens from its link, and says in the open that it is a preview.
    + (cls.hidden ? '<span class="preview"'+(cls.prov && cls.prov[state.list] ? ' title="'+esc(cls.prov[state.list])+'"' : '')+'>Preview, number pending</span>' : "");

  $("tabs").innerHTML = LIST_TYPES.map(l =>
    '<button class="tab'+(l.id===state.list?" on":"")+'" role="tab" aria-selected="'+(l.id===state.list)+'" data-list="'+l.id+'">'+esc(l.label)+'</button>'
  ).join("");

  $("constraint").textContent = lt.desc;

  const rows = mergedList(cls, state.list);
  const pf = profsOf(rows);
  $("profs").hidden = !pf.length;
  $("profs").innerHTML = pf.length
    ? 'Professions assumed: ' + pf.map(p => '<b>'+esc(p[0])+'</b> ('+esc(p[1])+')').join('<span class="sep">\u00b7</span>')
    : "";

  const head = '<div class="row head"><span>Slot</span><span>Item</span>'
    + '<span>Enchant</span><span>Gems</span></div>';

  $("ledger").innerHTML = head + rows.map((e, i) => {
    let ilvlTxt = "";
    if (e.ilvl != null){
      ilvlTxt = "ilvl "+esc(e.ilvl);
    }
    const sub = [ilvlTxt, e.source?esc(e.source):""].filter(Boolean).join(" · ");
    return '<div class="row" style="--i:'+i+'">'
      + '<span class="slot">'+esc(e.slot)+'</span>'
      + '<span class="item">'+(e.item ? whLink(e)+vTag(e) : '<span class="none">—</span>')+'</span>'
      + '<span class="ench">'+enchLink(e)+'</span>'
      + '<span class="gems">'+gemLinks(e)+'</span>'
      + ((e.item && sub) ? '<span class="note">'+sub+hmBadge(e)+'</span>' : "")
      + (e.why ? '<span class="why">'+whyHtml(e.why)+'</span>' : "")
      + (e.item ? altLinks(e) : "")
      + '</div>';
  }).join("");

  // The key is read off the rows just drawn, so it cannot name a badge the
  // list does not show or miss one it does.
  const used = Object.keys(BADGE).filter(k => $("ledger").querySelector('[data-badge="'+k+'"]'));
  $("key").hidden = !used.length;
  $("key").innerHTML = used.map(k =>
    '<li><span class="'+BADGE[k][0]+'">'+BADGE[k][1]+'</span> <span>'+esc(BADGE[k][2])+'</span></li>').join("");

  const notes = cls.notes || [];
  statPanel(cls);
  const tal = cls.talents && cls.talents[state.list];
  $("talents").hidden = !tal;
  if (tal) $("talentstr").textContent = tal;
  const cons = consumFor(cls, state.list);
  $("consum").hidden = !cons;
  // Ruling D3, 2026-10-11: only the Full buffed list sims its consumables. The
  // other three disable potion, flask, food and weapon buff, so their number
  // is without what this panel lists, and the panel says so.
  $("consumnote").hidden = state.list === "alltime_buffed";
  if (cons) $("consumlines").innerHTML = consumHtml(cons);
  const bw = state.list === "alltime_buffed" ? (cls.buffWorth || null) : null;
  $("buffworth").hidden = !bw || !bw.length;
  if (bw && bw.length) $("buffworth").style.setProperty("--cc", cls.color);
  if (bw && bw.length) { $("buffworthlines").classList.remove("cmpopen"); $("buffworthlines").innerHTML = bw.map(b => {
    const tip = (BW_TAG[b.status] || BW_TAG.measured)[0];
    const isComp = !!(b.note && b.note.indexOf("Consumables") !== -1);
    const isHead = b.buff === "Consumables";
    let note = b.note || "";
    if (isComp) note = note.replace(/^in Consumables(, )?/, "");
    return '<span class="cline'+(isComp ? ' bwsub' : '')+(isHead ? ' bwhead' : '')+'"'+(isHead ? ' title="Click to show the component split"' : '')+'><b>'
    // The head row opens the split. A real button, so it takes the keyboard and
    // says whether it is open; a click anywhere on the row still works.
    + (isHead ? '<button type="button" class="bwtoggle" aria-expanded="false">'+esc(b.buff)+'</button>' : esc(b.buff))+'</b>'
    + '<span class="bwval">'+(b.dps > 0 ? "+" : "")+b.dps.toLocaleString()+' DPS</span>'
    + '<small class="bwpct">('+(b.pct > 0 ? "+" : "")+b.pct.toFixed(1)+'%)</small>'
    + '<small class="bwtag"'+(isComp ? ' style="border:none"' : ' title="'+tip.replace(/"/g, "&quot;")+'"')+'>'+(isComp ? "" : esc(b.status))+'</small>'
    + '<small class="bwnote">'+esc(note)+'</small>'
    + '</span>'; }).join("");
  $("buffworthlines").onclick = e => {
    if (!(e.target.closest && e.target.closest(".bwhead"))) return;
    const open = $("buffworthlines").classList.toggle("cmpopen");
    const t = $("buffworthlines").querySelector(".bwtoggle");
    if (t) t.setAttribute("aria-expanded", String(open));
  }; }
  // Key to the tags the panel shows. Component rows carry no tag.
  const tags = (bw || []).filter(b => !(b.note && b.note.indexOf("Consumables") !== -1)).map(b => b.status);
  $("bwkey").innerHTML = Object.keys(BW_TAG).filter(s => tags.includes(s)).map(s =>
    '<b>'+esc(s)+'</b> '+esc(BW_TAG[s][1] || BW_TAG[s][0])).join(" ");
  $("paneline").classList.toggle("wbw", !(!bw || !bw.length));
  $("paneline").classList.toggle("solo", $("statpanel").hidden);
  $("classnotes").hidden = true; // class notes hidden for now
  const cr = cls.credits && cls.credits[state.list];
  $("creditline").hidden = !cr;
  if (cr) $("creditline").textContent = "Special thanks to " + cr + " for this list.";
  $("classnotes").innerHTML = notes.length
    ? '<h3>'+esc(specOf(cls, state.list))+' notes</h3>' + notes.map(n=>'<p>'+esc(n)+'</p>').join("")
    : "";
  $("copyout").style.display = "none";
}

/* Analytics. GoatCounter's script counts the arrival by itself, under the
   page's own path. countView adds the views: each class/spec/list a visitor
   opens, under that view's path. The script is async and arrives after the
   first render, so a count that finds it missing is left for the next call;
   the load handler at the bottom of this script makes that call. An arrival on
   a link that names a view is counted as that view; an arrival on the bare
   address is not, since nobody chose the default view.                      */
const viewPath = () => (location.hash || "").replace(/^#/, "") || "home";
let lastCounted = null;
function countView(){
  const path = viewPath();
  if(path === lastCounted) return;   // re-renders (sort changes) aren't new views
  if(!(window.goatcounter && window.goatcounter.count)) return;   // not loaded yet, or blocked
  lastCounted = path;
  window.goatcounter.count({ path: path, title: document.title, event: false });
}
// push: the visitor chose this view (a class, a tab, the view switch), so it
// gets a history entry. Left out by the first render and by the one that
// answers Back, Forward or a typed address.
function render(push){
  // The entry shown has to carry the list shown. Under "Best per class" it also
  // has to be its class's best on that list, because the class list offers no
  // other: Druid is Balance on All-Time and Obtainable and Feral on the other
  // two, and a tab click used to leave Balance up with nothing selected.
  const cur = entryOf(state.cls);
  if(cur && (!((cur.dpsByList || {})[state.list]) || (state.view === "best" && !isBest(cur)))){
    const p = bestOf(classKey(cur), state.list) || CLASSES.find(x => classKey(x) === classKey(cur) && x.primary);
    if(p) state.cls = p.id;
  }
  renderRail(); renderMain(); whRefresh(); writeHash(push); countView(); }

function asText(){
  const cls = CLASSES.find(c => c.id === state.cls);
  const lt  = LIST_TYPES.find(l => l.id === state.list);
  const lines = ["**"+specOf(cls, state.list)+" "+cls.name+" — BiS ("+lt.label+")** · "+CONFIG.patch+" · "+CONFIG.bracket];
  const cons = consumFor(cls, state.list);
  if(cons) lines.push("- Consumables: " + CONSUM_ORDER.map(([k,label]) => {
    const vs = e => { const v = variantOf(e); return v ? " ("+v+")" : ""; };
    if(k === "oil"){
      const parts = oilParts(cons.oil);
      return parts.length ? label+" "+parts.map(e => "["+e.item+"]"+vs(e)+" ("+e.hand+")").join(" ") : "";
    }
    const e = cons[k]; if(!e || !e.item) return "";
    return label+" ["+e.item+"]"+vs(e);
  }).filter(Boolean).join(" · "));
  const rows = mergedList(cls, state.list);
  const pf = profsOf(rows);
  if(pf.length) lines.push("- Professions assumed: " + pf.map(p => p[0]+" ("+p[1]+")").join(" · "));
  const tbd = [];
  rows.forEach(e => {
    if(!e.item){ tbd.push(e.slot); return; }
    const gtxt = e.gems ? e.gems.map(g=>g.name+(g.n>1?" \u00d7"+g.n:"")).join(", ") : "";
    const hm = e.hm==="only" ? "HM only" : (e.hm==="socket" ? "Socket Proc" : "");
    const craft = BOP_CRAFT[e.wowhead] ? "Crafter only" : "";
    const ench = e.ench ? e.ench + (SCRIBE_ENCH.has(e.enchsp) ? " (Scribe only)" : "") : "";
    const iv = e.ilvl==null ? "" :
      "ilvl "+e.ilvl;
    const bits = [iv, hm, craft, e.source||"", ench, gtxt].filter(Boolean).join(" · ");
    const vt = variantOf(e);
    lines.push("- "+e.slot+": ["+e.item+"]"+(vt?" ("+vt+")":"")+(bits?" — "+bits:""));
    if(e.alts && e.alts.length){
      const fmt = list => list.map(a=>{
        const av = variantOf(a);
        return "["+a.item+"]"+(av?" ("+av+")":"")
          + (a.delta==null?" (sim pending)":" ("+(a.delta>0?"+":"")+a.delta.toFixed(1)+"%)");
      }).join(", ");
      const near = e.alts.filter(altNear), far = e.alts.filter(a=>!altNear(a));
      if(near.length) lines.push("    within noise: "+fmt(near));
      if(far.length)  lines.push("    fallback: "+fmt(far));
    }
  });
  if(tbd.length) lines.push("- TBD: "+tbd.join(", "));
  return lines.join("\n");
}

$("sortsel").addEventListener("change", ev => { state.sort = ev.target.value; render(); });
$("talentcopy").addEventListener("click", () => {
  const t = $("talentstr").textContent, b = $("talentcopy");
  const done = () => { b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy", 1400); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done).catch(()=>{});
  else { const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); done(); }
});
$("consumcopy").addEventListener("click", () => {
  const cls = CLASSES.find(c => c.id === state.cls);
  const cons = consumFor(cls, state.list);
  if(!cons) return;
  const t = consumSimc(cons), b = $("consumcopy");
  const done = () => { b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy SimC", 1400); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done).catch(()=>{});
  else { const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); done(); }
});
$("classsel").addEventListener("change", ev => { state.cls = ev.target.value; render(true); });
document.addEventListener("click", ev => {
  const c = ev.target.closest(".cls");
  if(c){ state.cls = c.dataset.cls; render(true); return; }
  const t = ev.target.closest(".tab");
  if(t){ state.list = t.dataset.list; render(true); return; }
  // The tag opens in place on a tap, where there is no hover for its tooltip.
  const ef = ev.target.closest(".efftag");
  if(ef){ ef.setAttribute("aria-expanded", String(ef.classList.toggle("open"))); return; }
});

$("copybtn").addEventListener("click", () => {
  const txt = asText();
  const done = () => {
    $("copymsg").style.opacity = 1;
    setTimeout(() => $("copymsg").style.opacity = 0, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(() => {
      const out = $("copyout"); out.value = txt; out.style.display = "block"; out.select();
    });
  } else {
    const out = $("copyout"); out.value = txt; out.style.display = "block"; out.select();
  }
});

$("metaline").innerHTML = "<b>"+esc(CONFIG.guild)+"</b> · "+esc(CONFIG.patch)+" · "+esc(CONFIG.bracket)
  + (CONFIG.updated ? ' · <span class="updated">updated '+esc(fmtUpdated(CONFIG.updated))+'</span>' : "");
// The header shows the changelog's newest day, so every list's updates —
// current tabs and any future ones — surface without hand-editing a notice.
// CONFIG.notice is only the fallback when the fetch cannot run (file://, offline).
// The line shown is the first sentence of the newest entry, which sits in the
// first few hundred bytes of a file of over 200 KB. So the page asks for the
// first 4 KB only (a Range request; GitHub Pages answers 206), and reads the
// whole file when a visitor opens the day's list. A server that ignores Range
// sends the whole file, and that works the same. If the first request fails
// or brings back nothing that parses, the whole file is read, as it always was.
// The two requests use different addresses so that a browser cannot answer the
// first from a stored, compressed copy of the second.
const CL_URL = "CHANGELOG.txt?v=" + encodeURIComponent(CONFIG.updated || "");
const CL_HEAD_URL = CL_URL + "&top=4k";
const CL_LINK = ' <span class="sep">\u00b7</span> <a href="CHANGELOG.txt" target="_blank" rel="noopener">full changelog</a>';
function parseChangelogTop(text){
  const m = text.match(/^## (\d{4}-\d{2}-\d{2})\s*$/m);
  if(!m) return null;
  const start = m.index + m[0].length;
  const rest  = text.slice(start);
  const end   = rest.search(/^## \d{4}-\d{2}-\d{2}\s*$/m);
  const body  = end === -1 ? rest : rest.slice(0, end);
  const entries = [];
  for(const line of body.split("\n")){
    if(/^- /.test(line)){
      const tm = line.match(/^- \[([a-z]+)\] ?/);
      entries.push({ tag: tm ? tm[1] : "", text: line.replace(/^- (\[[a-z]+\] ?)?/, "") });
    } else if(/^\s+\S/.test(line) && entries.length){
      entries[entries.length - 1].text += " " + line.trim();
    }
  }
  return entries.length ? { date: m[1], entries } : null;
}
// One short line per entry: the first sentence, capped at 120 chars on a
// word boundary. The full text lives in CHANGELOG.txt, linked right there.
function feedLine(t){
  const m = t.match(/^[\s\S]*?\.(?=\s|$)/);
  let s = m ? m[0] : t;
  if(s.length > 120){
    s = s.slice(0, 117);
    s = s.slice(0, Math.max(60, s.lastIndexOf(" "))) + "\u2026";
  }
  return s;
}
function renderNoticeFeed(n, top, whole){
  // whole: the full file has been read, so top holds every entry of the day.
  // Until then it holds what the first 4 KB had, which is enough for the line.
  let open = false;
  const draw = () => {
    const head = '<b>Latest updates \u2014 ' + esc(fmtUpdated(top.date)) + '</b>'
      + ' <span class="sep">\u00b7</span> <button type="button" class="nbtn" id="ntoggle" aria-expanded="' + open + '">'
      + (open ? "collapse" : "all updates") + '</button>' + CL_LINK;
    n.innerHTML = open
      ? head + '<ul class="nlist">' + top.entries.map(e =>
          "<li>" + (e.tag ? '<span class="chip">' + esc(e.tag) + "</span>" : "") + esc(feedLine(e.text)) + "</li>").join("") + "</ul>"
      : head + " " + esc(feedLine(top.entries[0].text));
    n.querySelector("#ntoggle").addEventListener("click", toggle);
  };
  const toggle = () => {
    if(open || whole){ open = !open; draw(); return; }
    fetch(CL_URL).then(r => r.ok ? r.text() : null)
      .then(t => { const full = t && parseChangelogTop(t); if(full) top = full; })
      .catch(() => {})
      .then(() => { whole = true; open = true; draw(); const b = n.querySelector("#ntoggle"); if(b) b.focus(); });
  };
  draw();
}
if (CONFIG.notice) {
  const n = document.createElement("div");
  n.className = "notice";
  n.innerHTML = esc(CONFIG.notice) + CL_LINK;
  $("metaline").insertAdjacentElement("afterend", n);
  if (window.fetch) fetch(CL_HEAD_URL, { headers: { Range: "bytes=0-4095" } })
    .then(r => r.ok ? r.text().then(t => [t, r.status !== 206]) : null)
    .catch(() => null)
    .then(a => (a && parseChangelogTop(a[0])) ? a : fetch(CL_URL).then(r => r.ok ? r.text().then(t => [t, true]) : null))
    .then(a => { const top = a && parseChangelogTop(a[0]); if(top) renderNoticeFeed(n, top, a[1]); })
    .catch(() => {});
}

// The skip link moves focus itself: following href="#main" would replace the
// view's address (#class/spec/list) with #main.
$("skiplink").addEventListener("click", ev => { ev.preventDefault(); $("main").focus(); });
document.getElementById("viewtoggle").addEventListener("click", e => {
  const b = e.target.closest("button[data-view]"); if(!b) return;
  const v = b.dataset.view; if(v === state.view) return;
  state.view = v;
  render(true);   // an entry only if the switch moves to another spec
});
// Back, Forward and an address typed or pasted over the open page.
window.addEventListener("hashchange", () => { if(readHash()) render(); });

const arrivedOnLink = readHash();
render();
if(!arrivedOnLink) lastCounted = viewPath();   // bare address: the arrival is all there is to count
window.addEventListener("load", countView);    // count.js has run by now, if it is going to
</script>
<script data-goatcounter="https://fate.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
