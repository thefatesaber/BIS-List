<html lang="en">

<style>
:root{
  --void:#0b0d12; --slate:#141822; --slate2:#181d29; --edge:#232a39;
  --parchment:#e7e4dc; --dust:#8e97a8; --dim:#5c6575;
  --epic:#a335ee;
  --confirmed:#41c176; --sim:#4fa3ff; --theory:#e0a53f; --tbd:#566074;
  --mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
  --display:"Cinzel", "Friz Quadrata", Georgia, serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--void); color:var(--parchment);
  font-family:var(--mono); font-size:13.5px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}

/* ---------- masthead ---------- */
header{
  border-bottom:1px solid var(--edge);
  padding:20px 24px 16px;
  display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 18px;
}
header h1{
  margin:0; font-family:var(--display); font-weight:700;
  font-size:clamp(19px,3.2vw,26px); letter-spacing:.04em; color:var(--parchment);
}
header h1 .thirty{color:var(--epic)}
.meta{color:var(--dust); font-size:12px; letter-spacing:.02em}
.meta b{color:var(--parchment); font-weight:500}

/* ---------- layout ---------- */
.layout{display:flex; min-height:calc(100vh - 70px)}
.side{
  width:196px; flex:0 0 196px; border-right:1px solid var(--edge);
  display:flex; flex-direction:column; min-height:0;
}
nav{flex:1; padding:8px 0 12px; overflow-y:auto}
main{flex:1; min-width:0; padding:20px 24px 48px}

/* ---------- class rail ---------- */
.sortrow{display:flex; align-items:center; gap:10px; padding:12px 14px 10px;
  border-bottom:1px solid var(--edge)}
.sortlabel{color:var(--dust); font-size:11px; letter-spacing:.1em; text-transform:uppercase}
.classrow{display:none; align-items:center; gap:10px; padding:10px 14px;
  border-bottom:1px solid var(--edge)}
#sortsel, #classsel{
  flex:0 0 auto; width:auto; background:var(--slate2); border:1px solid var(--edge);
  color:var(--parchment); font:inherit; font-size:12px; letter-spacing:.05em;
  padding:6px 28px 6px 12px; border-radius:6px; cursor:pointer;
  appearance:none; -webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='5' viewBox='0 0 8 5'><path d='M0 0l4 5 4-5z' fill='%238a93a6'/></svg>");
  background-repeat:no-repeat; background-position:right 10px center;
}
#classsel{flex:1; min-width:0; width:100%}
#sortsel:hover, #classsel:hover{border-color:var(--dust)}
#sortsel:focus-visible, #classsel:focus-visible{outline:2px solid var(--epic); outline-offset:2px}

.cls{
  display:flex; align-items:center; gap:10px; width:100%;
  padding:8px 16px; background:none; border:0; border-left:3px solid transparent;
  color:var(--dust); font:inherit; font-size:13px; cursor:pointer; text-align:left;
}
.cls:hover{color:var(--parchment); background:var(--slate)}
.cls.on{color:var(--parchment); background:var(--slate); border-left-color:var(--cc)}
.cls .dot{width:9px; height:9px; border-radius:2px; background:var(--cc); flex:0 0 9px}
.cls .who{display:flex; flex-direction:column; min-width:0}
.cls .who small{color:var(--dim); font-size:10.5px; letter-spacing:.03em}
.cls .fill{margin-left:auto; color:var(--dim); font-size:10.5px}
.cls .dps{margin-left:auto; padding-left:8px; color:var(--dim); font-size:11px;
  font-variant-numeric:tabular-nums; letter-spacing:.02em; transition:color .15s ease}
.cls:hover .dps{color:var(--dust)}
.cls.on .dps{color:var(--cc); font-weight:600}
.cls.on .fill{color:var(--dust)}

/* ---------- spec header + tabs ---------- */
.spec-head{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 14px; margin:0 0 14px}
.spec-head h2{
  margin:0; font-family:var(--display); font-weight:600;
  font-size:clamp(17px,2.6vw,22px); letter-spacing:.03em; color:var(--cc,#fff);
}
.dpsbadge{display:inline-flex; align-items:baseline; gap:5px; margin-left:2px; padding:3px 10px;
  border:1px solid color-mix(in srgb, var(--cc) 45%, transparent); border-radius:999px;
  background:color-mix(in srgb, var(--cc) 12%, transparent);
  color:var(--cc); font-size:14px; font-weight:700; letter-spacing:0;
  font-variant-numeric:tabular-nums; text-transform:none}
.dpsbadge b{font-weight:700}
.spec-head .clsname{color:var(--cc,var(--dust)); font-family:var(--display); font-weight:600;
  letter-spacing:.03em; font-size:clamp(17px,2.6vw,22px)}
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px}
.tab{
  font:inherit; font-size:12px; letter-spacing:.02em; cursor:pointer;
  color:var(--dust); background:var(--slate); border:1px solid var(--edge);
  border-radius:3px; padding:5px 12px;
}
.tab:hover{color:var(--parchment)}
.tab.on{color:var(--void); background:var(--parchment); border-color:var(--parchment); font-weight:600}
.constraint{color:var(--dim); font-size:11.5px; margin:0 0 16px; font-style:italic}

/* ---------- slot ledger ---------- */
.ledger{border:1px solid var(--edge); border-radius:4px; overflow:hidden}
.row{
  display:grid; grid-template-columns:104px minmax(0,1.9fr) minmax(0,.8fr) minmax(0,1fr);
  gap:0 14px; padding:7px 14px; align-items:center;
  border-bottom:1px solid var(--edge); background:var(--slate);
}
.row:nth-child(even){background:var(--slate2)}
.row:last-child{border-bottom:0}
.row.head{
  background:var(--void); color:var(--dim); font-size:10.5px;
  text-transform:uppercase; letter-spacing:.09em; padding:8px 14px;
}
.slot{color:var(--dust); font-size:12px}
.item a{color:var(--epic); text-decoration:none; font-weight:500; display:inline-flex; align-items:center; gap:10px}
.item a > ins, .item a span[class*="icon"]{flex:none; width:34px !important; height:34px !important;
  box-sizing:border-box !important; border:0 !important; padding:0 !important; margin:0 !important;
  border-radius:4px; overflow:hidden; clip-path:inset(0 round 4px);
  background-size:34px 34px !important; background-position:center !important;
  box-shadow:0 0 0 2px var(--qc), 0 0 0 3px rgba(0,0,0,.65)}
.item a span[class*="icon"] ins{display:block; position:static !important; width:100% !important; height:100% !important;
  margin:0 !important; border:0 !important; background-size:cover !important; background-position:center !important}
.item a span[class*="icon"] del{display:none !important}
.item a.q1{color:#eaeaea}.item a.q2{color:#1eff00}.item a.q3{color:#2f8dff}.item a.q5{color:#ff8000}
.item a,.gems a{--qc:var(--epic)}
.item a.q1,.gems a.q1{--qc:#eaeaea}
.item a.q2,.gems a.q2{--qc:#1eff00}
.item a.q3,.gems a.q3{--qc:#2f8dff}
.item a.q5,.gems a.q5{--qc:#ff8000}
.item a:hover{text-decoration:underline}
.item .none{color:var(--tbd); margin-left:44px}
.ench,.gems{color:var(--dust); font-size:12px; overflow-wrap:anywhere}
.ench a{color:#2f8dff; text-decoration:none}
.ench a:hover{text-decoration:underline}
.ench a ins, .ench a del, .ench a span[class*="icon"]{display:none !important}
.gemgrp{display:flex; align-items:center; gap:6px; padding:2px 0; flex-wrap:wrap}
.gems a{color:var(--qc); text-decoration:none; display:inline-flex; align-items:center; gap:8px}
/* icon-only socket: keeps a visible socket square even if Wowhead never iconizes */
/* Extra socket icons must look identical to the named one. No ring here: the
   Wowhead-injected icon clips its own box-shadow via clip-path, so a ring on
   this anchor would be the only one that actually paints. Background is a
   fallback so the socket is still countable if iconization ever fails. */
.gems a.gicon{width:24px; height:24px; border-radius:3px; flex:none;
  background:rgba(255,255,255,.045)}
.hm{margin-left:8px; font-size:10px; font-weight:600; letter-spacing:.06em;
  text-transform:uppercase; padding:1px 6px; border-radius:3px; white-space:nowrap;
  border:1px solid currentColor}
.hm.only{color:#ff9d5c}
.hm.ilvl{color:#8ab4f8}
.hm.socket{color:#ff5c5c}
.vtag{margin-left:7px; font-size:9.5px; font-weight:600; letter-spacing:.07em;
  text-transform:uppercase; padding:1px 5px; border-radius:3px; white-space:nowrap;
  color:#e0a53f; border:1px solid currentColor; vertical-align:1px}
.alts{grid-column:2 / -1; padding-left:44px; padding-top:2px;
  color:var(--dim); font-size:11px; overflow-wrap:anywhere}
.alts em{font-style:normal; color:var(--tbd); text-transform:uppercase;
  font-size:9.5px; letter-spacing:.07em; margin-right:5px}
.alts a{color:#9fb6d4; text-decoration:none}
.alts a:hover{text-decoration:underline}
.alts a ins, .alts a del, .alts a span[class*="icon"]{display:none !important}
.alts .delta{color:var(--dust)}
.alts .pending{color:var(--tbd); font-style:italic}
.alts .sep{opacity:.5; margin:0 3px}
.gems a > ins, .gems a span[class*="icon"]{flex:none; width:24px !important; height:24px !important;
  box-sizing:border-box !important; border:0 !important; padding:0 !important; margin:0 !important;
  border-radius:3px; overflow:hidden; clip-path:inset(0 round 3px);
  background-size:24px 24px !important; background-position:center !important;
  box-shadow:0 0 0 2px var(--qc), 0 0 0 3px rgba(0,0,0,.65)}
.gems a span[class*="icon"] ins{display:block; position:static !important; width:100% !important; height:100% !important;
  margin:0 !important; border:0 !important; background-size:cover !important; background-position:center !important}
.gems a span[class*="icon"] del{display:none !important}
.gems a:hover{text-decoration:underline}
.note{
  grid-column:2 / -1; color:var(--dim); font-size:11.5px; padding-top:1px; padding-left:44px;
}

/* ---------- notes + actions ---------- */
.statpanel{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:0 18px;
  margin:0 0 14px; padding:14px 16px; border:1px solid var(--edge); border-radius:6px;
  background:linear-gradient(180deg, rgba(255,255,255,.035), transparent 65%), var(--slate)}
.statcell{display:flex; flex-direction:column; gap:3px; padding:7px 0}
.statcell.r{align-items:flex-end; text-align:right}
.statcell .lbl{color:var(--parchment); font-size:11px; letter-spacing:.09em; text-transform:uppercase; font-weight:600}
.statcell .val{display:flex; align-items:baseline; gap:8px; font-variant-numeric:tabular-nums}
.statcell.r .val{flex-direction:row-reverse}
.statcell .pct{color:var(--cc); font-size:15px; font-weight:700}
.statcell .rat{color:var(--dim); font-size:11.5px}
.statweb{grid-column:2; grid-row:1 / span 2; display:block; justify-self:center; max-width:100%}
.statpanel.wtop .statweb{grid-row:2 / span 2}
.stattop{grid-column:1 / -1; display:grid; grid-template-columns:1fr auto 1fr;
  grid-template-columns:subgrid}
.stattop > .statcell{grid-column:1}
.stattop > .statcell.r{grid-column:3}
.statweb .ring{fill:none; stroke:rgba(255,255,255,.14); stroke-width:1}
.statweb .ring:first-of-type{stroke:rgba(255,255,255,.24); stroke-width:1.5;
  fill:color-mix(in srgb, var(--cc) 7%, transparent)}
.statweb .axis{stroke:rgba(255,255,255,.10); stroke-width:1; stroke-dasharray:2 3}
.statweb .area{fill:color-mix(in srgb, var(--cc) 26%, transparent); stroke:var(--cc); stroke-width:1.5;
  stroke-linejoin:round}
.statweb .dot{fill:var(--parchment); stroke:var(--cc); stroke-width:1.5}
.paneline{display:grid; grid-template-columns:auto minmax(0,1fr); grid-template-rows:auto auto;
  gap:14px; margin:0 0 14px}
.paneline > .statpanel{grid-column:1; grid-row:1 / 3; margin:0}
.paneline > .consum{grid-column:2; grid-row:1; margin:0; min-width:0}
.paneline > .talents{grid-column:2; grid-row:2; margin:0; min-width:0}
.paneline.solo{grid-template-columns:minmax(0,1fr)}
.paneline.solo > .consum, .paneline.solo > .talents{grid-column:1}
.statpanel[hidden], .consum[hidden]{display:none !important}
.consum{display:flex; align-items:center; align-content:center; flex-wrap:wrap; gap:6px 14px;
  margin:0 0 14px; padding:9px 12px;
  border:1px solid var(--edge); border-radius:4px; background:var(--slate)}
.consum h3{margin:0; flex:none; font-size:10px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--dim); font-weight:600}
#consumlines{display:contents}
.consum .cline{white-space:nowrap; color:var(--dust); font-size:12px}
.consum .cline b{color:var(--dim); font-weight:600; font-size:10px; letter-spacing:.07em;
  text-transform:uppercase; margin-right:5px}
.consum .cline small{color:var(--dim); font-size:10.5px; margin-left:3px}
.consum .cbreak{flex:1 0 100%; height:0; margin:0; padding:0}
.consum .tbtn{margin-left:auto}
.talents{display:flex; align-items:center; gap:10px; margin:0 0 14px; padding:9px 12px;
  border:1px solid var(--edge); border-radius:4px; background:var(--slate)}
.talents h3{margin:0; flex:none; font-size:10px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--dim); font-weight:600}
.talents code{flex:1; min-width:0; overflow-x:auto; white-space:nowrap; color:var(--dust);
  font-size:11.5px; letter-spacing:.01em; scrollbar-width:thin}
.tbtn{flex:none; background:none; border:1px solid var(--edge); color:var(--dust); font:inherit;
  font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; padding:4px 10px;
  border-radius:4px; cursor:pointer; transition:color .15s ease, border-color .15s ease, transform .13s ease}
.tbtn:hover{color:var(--parchment); border-color:var(--dust); transform:translateY(-1px)}
.tbtn:active{transform:translateY(0) scale(.98)}
.classnotes{margin:18px 0 0; padding:12px 14px; border:1px solid var(--edge); border-radius:4px; background:var(--slate)}
.classnotes h3{margin:0 0 6px; font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--dim); font-weight:600}
.classnotes p{margin:3px 0; color:var(--dust); font-size:12px}
.credit{margin:10px 2px 0; color:var(--dim); font-size:11.5px; font-style:italic}
.why{grid-column:2 / -1; margin:5px 0 2px 44px; padding:7px 10px; border-left:2px solid var(--edge);
  background:rgba(255,255,255,.025); border-radius:0 4px 4px 0;
  color:var(--dust); font-size:11.5px; line-height:1.55; font-style:normal; max-width:78ch}
.why b{color:var(--parchment); font-weight:600; letter-spacing:.02em}
.why a{color:#8ab4f8; text-decoration:none; border-bottom:1px dotted rgba(138,180,248,.5)}
.why a:hover{border-bottom-style:solid}
.why a ins, .why a del, .why a span[class*="icon"]{display:none !important}
.actions{margin-top:16px; display:flex; gap:10px; align-items:center}
.btn{
  font:inherit; font-size:12px; cursor:pointer; border-radius:3px;
  color:var(--parchment); background:var(--slate); border:1px solid var(--edge); padding:6px 14px;
}
.btn:hover{border-color:var(--dust)}
#copymsg{color:var(--confirmed); font-size:11.5px; opacity:0; transition:opacity .2s}
#copyout{
  display:none; width:100%; margin-top:10px; min-height:180px;
  background:var(--void); color:var(--dust); border:1px solid var(--edge);
  border-radius:3px; font:inherit; font-size:11.5px; padding:10px;
}

/* ---------- legend ---------- */
footer{
  border-top:1px solid var(--edge); margin-top:28px; padding:12px 0 0;
  color:var(--dim); font-size:11px; display:flex; flex-wrap:wrap; gap:6px 18px;
}

/* ---------- motion ---------- */
.row{transition:background-color .16s ease}
.row:hover{background:rgba(255,255,255,.03)}
.row.head{transition:none}
.item a, .gems a, .ench a{transition:color .15s ease, filter .15s ease}
.item a:hover, .gems a:hover{filter:brightness(1.16)}
.item a > ins, .item a span[class*="icon"],
.gems a > ins, .gems a span[class*="icon"]{
  transition:box-shadow .18s ease, transform .18s cubic-bezier(.2,.8,.36,1.15);
}
.item a:hover > ins, .item a:hover span[class*="icon"]{
  transform:translateY(-1px) scale(1.045);
  box-shadow:0 0 0 2px var(--qc), 0 0 0 3px rgba(0,0,0,.65), 0 3px 12px -3px var(--qc);
}
.gems a:hover > ins, .gems a:hover span[class*="icon"]{
  transform:scale(1.07);
  box-shadow:0 0 0 2px var(--qc), 0 0 0 3px rgba(0,0,0,.65), 0 2px 9px -2px var(--qc);
}
.item a span[class*="icon"] ins{transition:transform .3s ease}
.item a:hover span[class*="icon"] ins{transform:scale(1.1)}
.cls, .tab, .btn, #sortsel{transition:background-color .15s ease, color .15s ease,
  border-color .15s ease, transform .13s ease, box-shadow .18s ease}
.tab:hover{transform:translateY(-1px)}
.tab:active{transform:translateY(0) scale(.98)}
.cls:hover{transform:translateX(2px)}
.cls:active{transform:translateX(2px) scale(.985)}
.btn:hover{transform:translateY(-1px); box-shadow:0 3px 10px -4px rgba(0,0,0,.7)}
.btn:active{transform:translateY(0) scale(.98)}
@media (prefers-reduced-motion: no-preference){
  .row{animation:rowIn .26s cubic-bezier(.22,.7,.3,1) both;
    animation-delay:calc(min(var(--i,0), 18) * 13ms)}
  .row.head{animation:none}
  @keyframes rowIn{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}
}
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{animation:none !important; transition:none !important}
}

/* ---------- responsive ---------- */
@media (max-width:860px){
  .layout{display:block}
  .side{width:auto; flex:none; display:block; border-right:0}
  .sortrow{padding:10px 12px}
  .classrow{display:flex; padding:10px 12px}
  nav{display:none}
  .cls{flex:0 0 auto; border-left:0; border-bottom:2px solid transparent; padding:6px 10px}
  .cls.on{border-bottom-color:var(--cc)}
  .cls .who small,.cls .fill{display:none}
  .cls .dps{margin-left:6px; padding-left:0}
  main{padding:16px 14px 40px}
  .row{grid-template-columns:1fr auto; gap:1px 10px; padding:9px 12px}
  .row.head{display:none}
  .slot{grid-column:1; font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--dim)}
  .item{grid-column:1 / -1}
  .ench{display:none}
  /* keep sockets visible on mobile, icons only — socket count is BiS-relevant */
  .gems{grid-column:1 / -1; padding-left:44px}
  .gems a.gname{font-size:0; gap:0}
  .gemgrp{padding:1px 0}
  .note{grid-column:1 / -1}
  .why{grid-column:1 / -1; margin-left:0; max-width:none}
  .statpanel{gap:0 10px; padding:12px}
  .statweb{width:104px; height:104px}
  .consum{gap:5px 10px}
  .consum .tbtn{margin-left:0; flex:1 0 100%; order:9}
  .paneline{grid-template-columns:minmax(0,1fr)}
  .paneline > .statpanel{grid-column:1; grid-row:auto}
  .paneline > .consum, .paneline > .talents{grid-column:1; grid-row:auto}
  .statcell .pct{font-size:14px}
  .talents{flex-wrap:wrap; gap:6px}
  .talents code{flex:1 0 100%; order:3}
  .alts{grid-column:1 / -1; padding-left:44px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.tab:focus-visible,.cls:focus-visible,.btn:focus-visible,.item a:focus-visible{
  outline:2px solid var(--epic); outline-offset:2px;
}
</style>
<script>const whTooltips = { colorLinks: false, iconizeLinks: true, renameLinks: false, iconSize: 'medium' };</script>
<script src="https://wow.zamimg.com/js/tooltips.js"></script>
</head>
<body>

<header>
  <h1><span class="thirty">FATE</span> · BiS COMPENDIUM</h1>
  <span class="meta" id="metaline"></span>
</header>

<div class="layout">
  <aside class="side">
  <div class="sortrow">
    <label class="sortlabel" for="sortsel">Order</label>
    <select id="sortsel" aria-label="Class order">
      <option value="dps">DPS</option>
      <option value="alpha">A–Z</option>
    </select>
  </div>
  <div class="classrow">
    <label class="sortlabel" for="classsel">Class</label>
    <select id="classsel" aria-label="Class"></select>
  </div>
  <nav id="rail" aria-label="Classes"></nav>
  </aside>
  <main>
    <div class="spec-head" id="spechead"></div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <p class="constraint" id="constraint"></p>
    <div class="paneline" id="paneline">
      <div class="statpanel" id="statpanel" hidden></div>
      <div class="consum" id="consum" hidden>
        <h3>Consumables</h3>
        <span id="consumlines"></span>
        <button class="tbtn" id="consumcopy">Copy SimC</button>
      </div>
      <div class="talents" id="talents" hidden>
        <h3>Talent string</h3>
        <code id="talentstr"></code>
        <button class="tbtn" id="talentcopy">Copy</button>
      </div>
    </div>
    <div class="ledger" id="ledger"></div>
    <p class="credit" id="creditline" hidden></p>
    <div class="classnotes" id="classnotes" hidden></div>
    <div class="actions">
      <button class="btn" id="copybtn">Copy list as text</button>
      <span id="copymsg">copied</span>
    </div>
    <textarea id="copyout" readonly aria-label="List as text"></textarea>

  </main>
</div>

     item     item name (omit or leave list empty -> renders TBD)
     wowhead  numeric item ID (optional; falls back to Wowhead search)
     ilvl     number/string (optional)
     variant  string (optional) — difficulty label shown beside the item name,
              e.g. "Heroic". Defaults from ITEM_VARIANT by item id.
     source   where it drops (optional)
     ench     enchant name (optional)
     enchsp   enchant spell id for the wowhead link (optional)
     dps      all-time sim dps (kept for reference)
     dpsByList  {alltime, obtainable, herald} — per-list sim dps
     talents    {alltime, obtainable, herald} — per-list talent import string
     stats      {list: {crit|haste|mastery|vers: [percent, rating]}} — optional stat panel;
                also takes main: N (primary stat rating, label auto per class)
                and stam: N (stamina), shown in a band above the secondaries
     consumables  {potion, flask, food, oil}, each {item, wowhead}; oil is
                  either {item, wowhead, hands:"MH/OH"|"MH"} for one weapon
                  buff, or {mh:{item,wowhead}, oh:{item,wowhead}} for a
                  different buff per hand (oh optional). Flat = shared across
                  all three lists, or key by list id:
                  {alltime:{...}, obtainable:{...}, herald:{...}}
     credits  optional {listId: name} — renders a thanks line under that list
     why      optional per-row one-liner explaining the pick
     gems     [{id, name, n}] socketed gems — n renders as n separate socket icons
     hm       "only" -> hard-mode exclusive drop (badge)
              "ilvl" -> drops on normal too, hard mode gives higher ilvl (badge)
     ilvlNormal  with hm:"ilvl", the NORMAL-mode ilvl. Renders "ilvl 41 -> 43 HM".
                 `ilvl` should always be the value you actually simmed.
     alts     [{item, wowhead, q, delta}] near-tie alternates. delta = signed %

              Only add entries you have actually swept. This is not a loot list.

     note     free text, shown under the row (optional)

/* ---------- URL state ----------------------------------------------------
   Shareable as #class/spec/list, e.g. #warrior/fury/herald. Class and spec are
   separate segments, so the Frost DK / Frost Mage collision resolves naturally
   without a compound slug. Segments are matched independently: a link that
   names only the class still lands on that class, and a spec that is
   unambiguous on its own resolves even if the class segment is wrong or
   missing. Unknown fragments are ignored rather than throwing, so an old or
   hand-typed link still loads instead of erroring.                          */
const slugify = v => String(v).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
const classSlug = c => slugify(c.name);
const specSlug  = c => slugify(c.spec);
function readHash(){
  const raw = (location.hash || "").replace(/^#/, "");
  if(!raw) return false;
  const seg = raw.split("/").map(x => slugify(decodeURIComponent(x || ""))).filter(Boolean);
  if(!seg.length) return false;

  // Trailing segment is the list when it names one; otherwise treat all
  // segments as class/spec so #warrior/fury works as well as #warrior/fury/herald.
  const listOf = sl => LIST_TYPES.find(t => t.id === sl || slugify(t.label) === sl) || null;
  let l = listOf(seg[seg.length - 1]);
  const cls = l ? seg.slice(0, -1) : seg;

  // Class first, then narrow by spec — falling back to a spec-only match so a
  // two-segment legacy link (#fury/herald) still resolves.
  let c = null;
  if(cls.length){
    const [a, b] = cls;
    const byClass = CLASSES.filter(x => classSlug(x) === a || x.id === a);
    c = (b && byClass.find(x => specSlug(x) === b))
     || (byClass.length === 1 ? byClass[0] : null)
     || CLASSES.find(x => specSlug(x) === a && (!b || specSlug(x) === b))
     || CLASSES.find(x => specSlug(x) === b)
     || CLASSES.find(x => specSlug(x) === a)
     || null;
  }
  let hit = false;
  if(c){ state.cls = c.id; hit = true; }
  if(l){ state.list = l.id; hit = true; }
  return hit;
}
// replaceState so back/forward isn't polluted by every click; pushing only on
// a real navigation would double-fire with the hashchange listener below.
function writeHash(){
  const c = CLASSES.find(x => x.id === state.cls);
  const h = "#" + classSlug(c) + "/" + specSlug(c) + "/" + state.list;
  if(location.hash !== h) history.replaceState(null, "", h);
}
const dpsFor = (c, listId) => (c.dpsByList && c.dpsByList[listId != null ? listId : state.list]) || 0;
function sortedClasses(){
  const a = [...CLASSES];
  if(state.sort === "alpha") a.sort((x,y) => x.name.localeCompare(y.name) || x.spec.localeCompare(y.spec));
  else a.sort((x,y) => (dpsFor(y) - dpsFor(x)) || ((y.dps||0) - (x.dps||0)));
  return a;
}

function mergedList(cls, listId){
  const raw = (cls.lists && cls.lists[listId]) || [];
  const bySlot = {};
  raw.forEach(e => { if(!(e.slot in bySlot)) bySlot[e.slot] = e; });
  const rows = DEFAULT_SLOTS.map(s => bySlot[s] || { slot:s, status:"tbd" });
  raw.forEach(e => { if(!DEFAULT_SLOTS.includes(e.slot)) rows.push(e); });
  return rows;
}
const filled = (cls, listId) =>
  mergedList(cls, listId).filter(r => r.item && (r.status||"tbd") !== "tbd").length;

function whLink(e){
  const url = e.wowhead
    ? "https://www.wowhead.com/item=" + e.wowhead
    : "https://www.wowhead.com/search?q=" + encodeURIComponent(e.item);
  return '<a'+(e.q?' class="q'+e.q+'"':'')+' href="'+url+'" target="_blank" rel="noopener">['+esc(e.item)+']</a>';
}

function renderRail(){
  $("sortsel").value = state.sort;
  $("classsel").innerHTML = sortedClasses().map(c =>
    '<option value="'+c.id+'">'+esc(c.name)+" \u2014 "+esc(c.spec)+"</option>"
  ).join("");
  $("classsel").value = state.cls;
  $("rail").innerHTML = sortedClasses().map(c => {
    const on = c.id === state.cls ? " on" : "";
    return '<button class="cls'+on+'" style="--cc:'+c.color+'" data-cls="'+c.id+'">'
      + '<span class="dot"></span>'
      + '<span class="who">'+esc(c.name)+'<small>'+esc(c.spec)+'</small></span>'
      + (dpsFor(c) ? '<span class="dps">'+dpsFor(c).toLocaleString()+'</span>' : "")
      + '</button>';
  }).join("");
}

function enchLink(e){
  if(!e.ench) return "";
  const url = e.enchsp
    ? "https://www.wowhead.com/spell=" + e.enchsp
    : "https://www.wowhead.com/search?q=" + encodeURIComponent(e.ench);
  return '<a href="'+url+'" target="_blank" rel="noopener">'+esc(e.ench)+'</a>';
}
const WHY_ITEMS = {
  "Nibelung": 50648, "Abracadaver": 51887,
  "Pendant of the Violet Eye": 28727, "Meteorite Crystal": 46051,
  "Gale of Shadows": 56462, "Solace of the Fallen": 47432,
  "Vibroblade": 9485
};
function whyHtml(text){
  let out = esc(text);
  const names = Object.keys(WHY_ITEMS).sort((a,b) => b.length - a.length);
  for(const n of names){
    const re = new RegExp("(?![^<]*>)" + n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "g");
    out = out.replace(re, '<a href="https://www.wowhead.com/item='+WHY_ITEMS[n]+'" target="_blank" rel="noopener">'+n+'</a>');
  }
  return out.replace(/^([^:]{3,40}:)/, '<b>$1</b>');
}
const PRIMARY = {warrior:"Strength", paladin:"Strength", deathknight:"Strength",
  hunter:"Agility", druid:"Agility", rogue:"Agility", monk:"Agility",
  mage:"Intellect", shaman:"Intellect", priest:"Intellect", warlock:"Intellect", evoker:"Intellect",
  demonhunter:"Intellect"};
const STAT_CAP = 75;
function statPanel(cls){
  const s = cls.stats && cls.stats[state.list];
  const el = $("statpanel");
  if(!s){ el.hidden = true; return; }
  el.hidden = false;
  el.style.setProperty("--cc", cls.color);
  const hasTop = s.main != null || s.stam != null;
  el.classList.toggle("wtop", hasTop);
  const tcell = (label, v, right) => '<div class="statcell'+(right?" r":"")+'">'
    + '<span class="lbl">'+label+'</span>'
    + '<span class="val"><span class="pct">'+v+'</span></span></div>';
  const top = hasTop ? '<div class="stattop">'
    + (s.main != null ? tcell(PRIMARY[cls.id] || "Primary", s.main) : '<span></span>')
    + (s.stam != null ? tcell("Stamina", s.stam, true) : '')
    + '</div>' : "";
  const K = [["crit","Critical Strike"],["mastery","Mastery"],["haste","Haste"],["vers","Versatility"]];
  // Fixed scale, shared by every panel, so shapes are comparable between specs.
  // 75 clears the highest secondary in the dataset (monk mastery 71.88) without
  // clipping it flat against the outer ring.
  const cap = STAT_CAP;
  const cell = (k, label, right) =>
    '<div class="statcell'+(right?" r":"")+'"><span class="lbl">'+label+'</span>'
    + '<span class="val"><span class="pct">'+((s[k]||[0])[0]).toFixed(2)+'%</span>'
    + '<span class="rat">'+((s[k]||[0,0])[1])+'</span></span></div>';
  // diamond: crit up, mastery right, vers down, haste left
  const R = 92, C = 70, order = ["crit","mastery","vers","haste"];
  const pt = (i, f) => {
    const ang = -Math.PI*3/4 + i*Math.PI/2, r = R*f;
    return [C + r*Math.cos(ang), C + r*Math.sin(ang)];
  };
  const poly = f => order.map((_,i) => pt(i,f).map(n => n.toFixed(1)).join(",")).join(" ");
  const vals = order.map(k => Math.min(1, ((s[k]||[0])[0]) / cap));
  const shape = order.map((k,i) => pt(i, vals[i]).map(n => n.toFixed(1)).join(",")).join(" ");
  const web = '<svg class="statweb" width="140" height="140" viewBox="0 0 140 140">'
    + [1,.66,.33].map(f => '<polygon class="ring" points="'+poly(f)+'"/>').join("")
    + order.map((_,i) => { const [x,y] = pt(i,1); return '<line class="axis" x1="'+C+'" y1="'+C+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'"/>'; }).join("")
    + '<polygon class="area" points="'+shape+'"/>'
    + order.map((_,i) => { const [x,y] = pt(i, vals[i]); return '<circle class="dot" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="4"/>'; }).join("")
    + '</svg>';
  el.innerHTML = top + cell("crit","Critical Strike") + web + cell("mastery","Mastery", true)
    + cell("haste","Haste") + cell("vers","Versatility", true);
}
function gemLinks(e){
  if(!e.gems) return "";
  return e.gems.map(g => {
    const n    = g.n || 1;
    const q    = g.q ? " q"+g.q : "";
    const href = "https://www.wowhead.com/item="+g.id;
    // One icon per socket. Empty leading anchors render icon-only; the last
    // carries the name. Socket count has to be readable at a glance.
    let out = '<span class="gemgrp">';
    for(let k=0;k<n-1;k++){
      out += '<a class="gicon'+q+'" href="'+href+'" target="_blank" rel="noopener" '
           + 'aria-hidden="true" tabindex="-1" title="'+esc(g.name)+'"></a>';
    }
    out += '<a class="gname'+q+'" href="'+href+'" target="_blank" rel="noopener">'
         + esc(g.name) + (n>1 ? " \u00d7"+n : "") + '</a></span>';
    return out;
  }).join("");
}

function hmBadge(e){
  if(e.hm === "only")  return '<span class="hm only" title="Hard mode exclusive \u2014 does not drop on normal">HM only</span>';
  if(e.hm === "ilvl")  return '<span class="hm ilvl" title="Drops on normal too; hard mode gives the higher item level">HM ilvl</span>';
  if(e.hm === "socket") return '<span class="hm socket" title="Only the socket-proc roll of this item is worth using">Socket Proc</span>';
  return "";
}

function altLinks(e){
  if(!e.alts || !e.alts.length) return "";
  const parts = e.alts.map(a => {
    const href = a.wowhead ? "https://www.wowhead.com/item="+a.wowhead
                           : "https://www.wowhead.com/search?q="+encodeURIComponent(a.item);
    const d = (a.delta == null)
      ? '<span class="pending">sim pending</span>'
      : '<span class="delta">'+(a.delta>0?"+":"")+esc(a.delta)+'%</span>';
    return '<a'+(a.q?' class="q'+a.q+'"':'')+' href="'+href+'" target="_blank" rel="noopener">'
         + esc(a.item)+'</a>'+vTag(a)+' '+d;
  });
  return '<span class="alts"><em>within noise:</em> '
       + parts.join(' <span class="sep">\u00b7</span> ') + '</span>';
}
const CONSUM_ORDER = [["potion","Potion"],["flask","Flask"],["food","Food"],["oil","Weapon"]];
function consumFor(cls, listId){
  const c = cls.consumables;
  if(!c) return null;
  return (c.potion || c.flask || c.food || c.oil) ? c : (c[listId] || null);
}
const simcTok = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"");
// Normalize either oil form into [{item, wowhead, hand}] so render and SimC
// export share one shape. Single-item form fans out to both hands when MH/OH.
function oilParts(o){
  if(!o) return [];
  if(o.mh || o.oh){
    const out = [];
    if(o.mh) out.push(Object.assign({hand:"MH"}, o.mh));
    if(o.oh) out.push(Object.assign({hand:"OH"}, o.oh));
    return out;
  }
  if(!o.item) return [];
  return [Object.assign({hand:o.hands || "MH"}, o)];
}
function consumHtml(c){
  return CONSUM_ORDER.map(([k,label]) => {
    if(k === "oil"){
      const parts = oilParts(c.oil);
      if(!parts.length) return "";
      // Weapon buffs always start their own row, however many hands are listed.
      return '<span class="cbreak"></span>' + parts.map((e,i) =>
        '<span class="cline">'+(i ? "" : '<b>'+label+'</b>')+whLink(e)
        + ' <small>'+esc(e.hand)+'</small></span>').join("");
    }
    const e = c[k]; if(!e || !e.item) return "";
    return '<span class="cline"><b>'+label+'</b>'+whLink(e)+'</span>';
  }).filter(Boolean).join("");
}
function consumSimc(c){
  const L = [];
  if(c.potion) L.push("potion="+simcTok(c.potion.item));
  if(c.flask)  L.push("flask="+simcTok(c.flask.item));
  if(c.food)   L.push("food="+simcTok(c.food.item));
  const parts = oilParts(c.oil);
  if(parts.length){
    const seg = [];
    for(const e of parts){
      const t = simcTok(e.item);
      if(e.hand === "OH") seg.push("off_hand:"+t);
      else { seg.push("main_hand:"+t); if(e.hand === "MH/OH") seg.push("off_hand:"+t); }
    }
    L.push("temporary_enchant="+seg.join("/"));
  }
  return L.join("\n");
}
const vTag = e => { const v = variantOf(e); return v ? '<span class="vtag">'+esc(v)+'</span>' : ""; };
function whRefresh(){
  if (window.$WowheadPower && window.$WowheadPower.refreshLinks) window.$WowheadPower.refreshLinks();
}
function renderMain(){
  const cls = CLASSES.find(c => c.id === state.cls);
  const lt  = LIST_TYPES.find(l => l.id === state.list);

  $("spechead").innerHTML =
    '<h2 style="--cc:'+cls.color+'">'+esc(cls.spec)+'</h2>'
    + '<span class="clsname" style="--cc:'+cls.color+'">'+esc(cls.name)+'</span>'
    + (dpsFor(cls) ? '<span class="dpsbadge" style="--cc:'+cls.color+'"><b>'+dpsFor(cls).toLocaleString()+'</b> DPS</span>' : "");

  $("tabs").innerHTML = LIST_TYPES.map(l =>
    '<button class="tab'+(l.id===state.list?" on":"")+'" role="tab" data-list="'+l.id+'">'+esc(l.label)+'</button>'
  ).join("");

  $("constraint").textContent = lt.desc;

  const head = '<div class="row head"><span>Slot</span><span>Item</span>'
    + '<span>Enchant</span><span>Gems</span></div>';

  $("ledger").innerHTML = head + mergedList(cls, state.list).map((e, i) => {
    let ilvlTxt = "";
    if (e.ilvl != null){
      ilvlTxt = (e.hm === "ilvl" && e.ilvlNormal != null)
        ? "ilvl "+esc(e.ilvlNormal)+" \u2192 "+esc(e.ilvl)+" HM"
        : "ilvl "+esc(e.ilvl);
    }
    const sub = [ilvlTxt, e.source?esc(e.source):""].filter(Boolean).join(" · ");
    return '<div class="row" style="--i:'+i+'">'
      + '<span class="slot">'+esc(e.slot)+'</span>'
      + '<span class="item">'+(e.item ? whLink(e)+vTag(e) : '<span class="none">—</span>')+'</span>'
      + '<span class="ench">'+enchLink(e)+'</span>'
      + '<span class="gems">'+gemLinks(e)+'</span>'
      + ((e.item && sub) ? '<span class="note">'+sub+hmBadge(e)+'</span>' : "")
      + (e.why ? '<span class="why">'+whyHtml(e.why)+'</span>' : "")
      + (e.item ? altLinks(e) : "")
      + '</div>';
  }).join("");

  const notes = cls.notes || [];
  statPanel(cls);
  const tal = cls.talents && cls.talents[state.list];
  $("talents").hidden = !tal;
  if (tal) $("talentstr").textContent = tal;
  const cons = consumFor(cls, state.list);
  $("consum").hidden = !cons;
  if (cons) $("consumlines").innerHTML = consumHtml(cons);
  $("paneline").classList.toggle("solo", $("statpanel").hidden);
  $("classnotes").hidden = true; // class notes hidden for now
  const cr = cls.credits && cls.credits[state.list];
  $("creditline").hidden = !cr;
  if (cr) $("creditline").textContent = "Special thanks to " + cr + " for this list.";
  $("classnotes").innerHTML = notes.length
    ? '<h3>'+esc(cls.spec)+' notes</h3>' + notes.map(n=>'<p>'+esc(n)+'</p>').join("")
    : "";
  $("copyout").style.display = "none";
}

function render(){ renderRail(); renderMain(); whRefresh(); writeHash(); }

function asText(){
  const cls = CLASSES.find(c => c.id === state.cls);
  const lt  = LIST_TYPES.find(l => l.id === state.list);
  const lines = ["**"+cls.spec+" "+cls.name+" — BiS ("+lt.label+")** · "+CONFIG.patch+" · "+CONFIG.bracket];
  const cons = consumFor(cls, state.list);
  if(cons) lines.push("- Consumables: " + CONSUM_ORDER.map(([k,label]) => {
    if(k === "oil"){
      const parts = oilParts(cons.oil);
      return parts.length ? label+" "+parts.map(e => "["+e.item+"] ("+e.hand+")").join(" ") : "";
    }
    const e = cons[k]; if(!e || !e.item) return "";
    return label+" ["+e.item+"]";
  }).filter(Boolean).join(" · "));
  const tbd = [];
  mergedList(cls, state.list).forEach(e => {
    if(!e.item || (e.status||"tbd")==="tbd"){ tbd.push(e.slot); return; }
    const gtxt = e.gems ? e.gems.map(g=>g.name+(g.n>1?" \u00d7"+g.n:"")).join(", ") : "";
    const hm = e.hm==="only" ? "HM only" : (e.hm==="ilvl" ? "HM ilvl" : (e.hm==="socket" ? "Socket Proc" : ""));
    const iv = e.ilvl==null ? "" :
      ((e.hm==="ilvl" && e.ilvlNormal!=null) ? "ilvl "+e.ilvlNormal+"\u2192"+e.ilvl+" HM" : "ilvl "+e.ilvl);
    const bits = [iv, hm, e.source||"", e.ench||"", gtxt].filter(Boolean).join(" · ");
    const vt = variantOf(e);
    lines.push("- "+e.slot+": ["+e.item+"]"+(vt?" ("+vt+")":"")+(bits?" — "+bits:""));
    if(e.alts && e.alts.length){
      lines.push("    within noise: "+e.alts.map(a=>{
        const av = variantOf(a);
        return "["+a.item+"]"+(av?" ("+av+")":"")
          + (a.delta==null?" (sim pending)":" ("+(a.delta>0?"+":"")+a.delta+"%)");
      }).join(", "));
    }
  });
  if(tbd.length) lines.push("- TBD: "+tbd.join(", "));
  return lines.join("\n");
}

$("sortsel").addEventListener("change", ev => { state.sort = ev.target.value; render(); });
$("talentcopy").addEventListener("click", () => {
  const t = $("talentstr").textContent, b = $("talentcopy");
  const done = () => { b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy", 1400); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done).catch(()=>{});
  else { const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); done(); }
});
$("consumcopy").addEventListener("click", () => {
  const cls = CLASSES.find(c => c.id === state.cls);
  const cons = consumFor(cls, state.list);
  if(!cons) return;
  const t = consumSimc(cons), b = $("consumcopy");
  const done = () => { b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy SimC", 1400); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done).catch(()=>{});
  else { const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); done(); }
});
$("classsel").addEventListener("change", ev => { state.cls = ev.target.value; render(); });
document.addEventListener("click", ev => {
  const c = ev.target.closest(".cls");
  if(c){ state.cls = c.dataset.cls; render(); return; }
  const t = ev.target.closest(".tab");
  if(t){ state.list = t.dataset.list; render(); return; }
});

$("copybtn").addEventListener("click", () => {
  const txt = asText();
  const done = () => {
    $("copymsg").style.opacity = 1;
    setTimeout(() => $("copymsg").style.opacity = 0, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(() => {
      const out = $("copyout"); out.value = txt; out.style.display = "block"; out.select();
    });
  } else {
    const out = $("copyout"); out.value = txt; out.style.display = "block"; out.select();
  }
});

$("metaline").innerHTML = "<b>"+esc(CONFIG.guild)+"</b> · "+esc(CONFIG.patch)+" · "+esc(CONFIG.bracket);

// Back/forward and pasted-link navigation.
window.addEventListener("hashchange", () => { if(readHash()) render(); });

readHash();
render();
</script>
